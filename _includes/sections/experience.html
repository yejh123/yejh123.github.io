<ul class="experience-list">
  {%- for position in site.data.experience %}
  <li class="position">
    <div class="position__header">
      <span><strong>{{ position.organization }}</strong>, {{ position.location }}</span>
      <span class="position__period">{{ position.period }}</span>
    </div>
    <div class="position__role">{{ position.role }}</div>
    {{ position.details | markdownify }}
  </li>
  {%- endfor %}
</ul>
