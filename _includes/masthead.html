{%- comment -%}
Links that do not fit move into the overflow list, see assets/js/main.js.
target="_self" keeps in-page links from opening a new tab under <base target="_blank">.
{%- endcomment -%}
<header class="masthead">
  <div class="masthead__inner">
    <nav class="site-nav">
      <button class="site-nav__toggle" type="button" aria-label="More links" aria-expanded="false"><span class="navicon"></span></button>
      <ul class="site-nav__links">
        <li class="site-nav__home"><a href="#" target="_self">Homepage</a></li>
        {%- for section in site.data.sections %}
        <li><a href="#{{ section.id }}" target="_self">{{ section.nav_title }}</a></li>
        {%- endfor %}
      </ul>
      <ul class="site-nav__overflow" hidden></ul>
    </nav>
  </div>
</header>
